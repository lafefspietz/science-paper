 <!doctype html>
<html>
<head>
<!--Stop Google:-->
<META NAME="robots" CONTENT="noindex,nofollow">

     <script src ="php.js"></script>
<title>references.bib Editor</title>
</head>
<body>
<h1>references.bib</h1>
<div id = "lightdarkbutton" class = "button">--> DARK MODE <--</div>

<textarea id = "text"></textarea>

<script>


currentFile = "references.bib";

load_file(currentFile).then(
    references => {
        document.getElementById("text").value = references;
    }
);

document.getElementById("text").onkeyup = function() {
    
    references = this.value;
    data = encodeURIComponent(references);
    save_file(currentFile,data);

}

lightmode = true;
document.getElementById("lightdarkbutton").style.color = "black";
document.getElementById("lightdarkbutton").style.borderColor = "black";

document.getElementById("text").style.backgroundColor = "white";
document.getElementById("text").style.color = "black";        
document.getElementById("lightdarkbutton").innerHTML = "DARK MODE";



lightmode = true;
document.getElementById("lightdarkbutton").style.color = "black";
document.getElementById("lightdarkbutton").style.borderColor = "black";

document.getElementById("text").style.backgroundColor = "white";
document.getElementById("text").style.color = "black";        
document.getElementById("lightdarkbutton").innerHTML = "DARK MODE";

document.getElementById("lightdarkbutton").onclick = function(){
    lightmode = !lightmode;
    if(lightmode){
        document.getElementById("lightdarkbutton").style.color = "black";
        document.getElementById("lightdarkbutton").style.borderColor = "black";
        document.getElementById("lightdarkbutton").style.backgroundColor = "white";
        document.getElementById("text").style.backgroundColor = "white";
        document.getElementById("text").style.color = "black";        
        document.getElementById("lightdarkbutton").innerHTML = "DARK MODE";
        
    }
    else{
        document.getElementById("lightdarkbutton").style.color = "white";
        document.getElementById("lightdarkbutton").style.borderColor = "white";
        document.getElementById("lightdarkbutton").style.backgroundColor = "#101010";
        document.getElementById("text").style.backgroundColor = "#101010";        
        document.getElementById("text").style.color = "white";        
        document.getElementById("lightdarkbutton").innerHTML = "LIGHT MODE";        
    }
}

</script>
<style>
body{
    overflow:hidden;
    font-family:Arial;
    background-color:#808080;
}


#text{
    position:absolute;
    left:1em;
    right:1em;
    bottom:1em;
    top:5em;
    border:solid;
    border-width:3px;
    overflow:scroll;
    padding: 1em 1em 1em 1em;
    background-color:white;
}

.button{
    cursor:pointer;
    background-color:white;
    
}
.button:hover{
    background-color:green;
}
.button:active{
    background-color:yellow;
}
#lightdarkbutton{
    position:absolute;
    right:10px;
    top:10px;
    width:10em;
    text-align:center;
    border:solid;
    border-radius:3px;
    font-size:2em;
    color:black;
}

</style>

</body>
</html>
